<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bid Leveling AI - Enhanced with Citations</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'JetBrains Mono', monospace; margin: 0; padding: 0; }
        #root { min-height: 100vh; }

        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.5; }
        }

        @keyframes spin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }

        .citation {
          cursor: pointer;
          border-bottom: 2px dotted #4a8fe7;
          transition: all 0.2s ease;
        }

        .citation:hover {
          background: rgba(74, 143, 231, 0.2);
          border-bottom-color: #00d4ff;
        }

        .pdf-viewer-container {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: rgba(0, 0, 0, 0.95);
          z-index: 1000;
          display: flex;
          flex-direction: column;
          padding: 2rem;
        }

        .pdf-canvas {
          flex: 1;
          overflow: auto;
          display: flex;
          justify-content: center;
          align-items: center;
        }

        canvas {
          max-width: 100%;
          height: auto;
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const API_URL = 'http://localhost:5000/api';

        // Configure PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        function PDFViewer({ pdfFile, highlightText, onClose }) {
          const canvasRef = useRef(null);
          const [pdfDoc, setPdfDoc] = useState(null);
          const [currentPage, setCurrentPage] = useState(1);
          const [numPages, setNumPages] = useState(0);

          useEffect(() => {
            if (pdfFile) {
              const fileReader = new FileReader();
              fileReader.onload = async (e) => {
                const typedArray = new Uint8Array(e.target.result);
                const loadingTask = pdfjsLib.getDocument(typedArray);
                const pdf = await loadingTask.promise;
                setPdfDoc(pdf);
                setNumPages(pdf.numPages);
              };
              fileReader.readAsArrayBuffer(pdfFile);
            }
          }, [pdfFile]);

          useEffect(() => {
            if (pdfDoc && currentPage) {
              renderPage(currentPage);
            }
          }, [pdfDoc, currentPage]);

          const renderPage = async (pageNum) => {
            const page = await pdfDoc.getPage(pageNum);
            const viewport = page.getViewport({ scale: 1.5 });
            const canvas = canvasRef.current;
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            await page.render({
              canvasContext: context,
              viewport: viewport
            }).promise;
          };

          return (
            <div className="pdf-viewer-container">
              <div style={{
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center',
                marginBottom: '1rem',
                padding: '1rem',
                background: '#1a4d8f',
                borderRadius: '8px',
              }}>
                <div style={{ color: '#00d4ff', fontSize: '1.2rem', fontWeight: 600 }}>
                  📄 {pdfFile?.name || 'PDF Viewer'}
                </div>
                <div style={{ display: 'flex', gap: '1rem', alignItems: 'center' }}>
                  <button
                    onClick={() => setCurrentPage(Math.max(1, currentPage - 1))}
                    disabled={currentPage <= 1}
                    style={{
                      padding: '0.5rem 1rem',
                      background: '#0064ff',
                      border: 'none',
                      borderRadius: '4px',
                      color: '#fff',
                      cursor: currentPage <= 1 ? 'not-allowed' : 'pointer',
                      opacity: currentPage <= 1 ? 0.5 : 1,
                    }}
                  >
                    ← Previous
                  </button>
                  <span style={{ color: '#e0e6ed' }}>
                    Page {currentPage} / {numPages}
                  </span>
                  <button
                    onClick={() => setCurrentPage(Math.min(numPages, currentPage + 1))}
                    disabled={currentPage >= numPages}
                    style={{
                      padding: '0.5rem 1rem',
                      background: '#0064ff',
                      border: 'none',
                      borderRadius: '4px',
                      color: '#fff',
                      cursor: currentPage >= numPages ? 'not-allowed' : 'pointer',
                      opacity: currentPage >= numPages ? 0.5 : 1,
                    }}
                  >
                    Next →
                  </button>
                  <button
                    onClick={onClose}
                    style={{
                      padding: '0.5rem 1rem',
                      background: '#ff4444',
                      border: 'none',
                      borderRadius: '4px',
                      color: '#fff',
                      cursor: 'pointer',
                      marginLeft: '1rem',
                    }}
                  >
                    ✕ Close
                  </button>
                </div>
              </div>
              {highlightText && (
                <div style={{
                  padding: '1rem',
                  background: 'rgba(74, 143, 231, 0.2)',
                  border: '1px solid #4a8fe7',
                  borderRadius: '6px',
                  marginBottom: '1rem',
                  color: '#e0e6ed',
                }}>
                  <strong>🔍 Looking for:</strong> "{highlightText}"
                </div>
              )}
              <div className="pdf-canvas">
                <canvas ref={canvasRef} />
              </div>
            </div>
          );
        }

        function FileProgressCard({ fileName, status, bidderName }) {
          const getStatusIcon = () => {
            switch (status) {
              case 'uploading': return '📤';
              case 'extracting': return '📝';
              case 'analyzing': return '🤖';
              case 'complete': return '✅';
              case 'error': return '❌';
              default: return '⏳';
            }
          };

          const getStatusText = () => {
            switch (status) {
              case 'uploading': return 'Uploading file...';
              case 'extracting': return 'Extracting text from PDF...';
              case 'analyzing': return 'AI is analyzing the bid...';
              case 'complete': return 'Analysis complete!';
              case 'error': return 'Analysis failed';
              default: return 'Waiting...';
            }
          };

          const getStatusColor = () => {
            switch (status) {
              case 'complete': return '#00ff88';
              case 'error': return '#ff4444';
              case 'analyzing': return '#4a8fe7';
              default: return '#ffaa00';
            }
          };

          return (
            <div style={{
              background: 'rgba(15, 22, 36, 0.8)',
              border: `2px solid ${getStatusColor()}`,
              borderRadius: '8px',
              padding: '1.5rem',
              marginBottom: '1rem',
              animation: status === 'analyzing' ? 'pulse 2s ease-in-out infinite' : 'none',
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', marginBottom: '0.75rem' }}>
                <div style={{
                  fontSize: '2rem',
                  animation: status === 'analyzing' ? 'spin 2s linear infinite' : 'none',
                }}>
                  {getStatusIcon()}
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ color: '#00d4ff', fontWeight: 600, marginBottom: '0.25rem' }}>
                    {bidderName}
                  </div>
                  <div style={{ color: '#6b8cae', fontSize: '0.85rem' }}>
                    {fileName}
                  </div>
                </div>
                <div style={{
                  color: getStatusColor(),
                  fontWeight: 600,
                  fontSize: '0.9rem',
                }}>
                  {getStatusText()}
                </div>
              </div>
              {(status === 'analyzing' || status === 'extracting') && (
                <div style={{
                  width: '100%',
                  height: '4px',
                  background: 'rgba(74, 143, 231, 0.2)',
                  borderRadius: '2px',
                  overflow: 'hidden',
                }}>
                  <div style={{
                    width: '100%',
                    height: '100%',
                    background: `linear-gradient(90deg, ${getStatusColor()}, #00d4ff)`,
                    animation: 'progress 1.5s ease-in-out infinite',
                  }} />
                </div>
              )}
            </div>
          );
        }

        function BidLevelingApp() {
          const [files, setFiles] = useState([]);
          const [bidderNames, setBidderNames] = useState([]);
          const [analyses, setAnalyses] = useState(null);
          const [loading, setLoading] = useState(false);
          const [error, setError] = useState(null);
          const [mode, setMode] = useState('compare');
          const [fileProgresses, setFileProgresses] = useState([]);
          const [pdfViewer, setPdfViewer] = useState(null);

          const handleFileChange = (e) => {
            const selectedFiles = Array.from(e.target.files);
            setFiles(selectedFiles);
            setBidderNames(selectedFiles.map((f, i) => `Bidder ${i + 1}`));
            setAnalyses(null);
            setError(null);
            setFileProgresses(selectedFiles.map((f, i) => ({
              fileName: f.name,
              bidderName: `Bidder ${i + 1}`,
              status: 'waiting',
            })));
          };

          const updateBidderName = (index, name) => {
            const newNames = [...bidderNames];
            newNames[index] = name;
            setBidderNames(newNames);

            const newProgresses = [...fileProgresses];
            if (newProgresses[index]) {
              newProgresses[index].bidderName = name;
            }
            setFileProgresses(newProgresses);
          };

          const updateFileProgress = (index, status) => {
            setFileProgresses(prev => {
              const updated = [...prev];
              updated[index] = { ...updated[index], status };
              return updated;
            });
          };

          const analyzeBids = async () => {
            if (files.length === 0) {
              setError('Please select at least one PDF file');
              return;
            }

            setLoading(true);
            setError(null);

            try {
              const results = [];

              for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const bidderName = bidderNames[i];

                // Update progress: Uploading
                updateFileProgress(i, 'uploading');
                await new Promise(resolve => setTimeout(resolve, 300));

                // Update progress: Extracting
                updateFileProgress(i, 'extracting');

                const formData = new FormData();
                formData.append('file', file);
                formData.append('bidder_name', bidderName);

                // Update progress: Analyzing
                updateFileProgress(i, 'analyzing');

                try {
                  const response = await fetch(`${API_URL}/analyze-bid-with-citations`, {
                    method: 'POST',
                    body: formData,
                  });

                  if (!response.ok) throw new Error('Analysis failed');

                  const data = await response.json();
                  data.pdfFile = file;  // Store file reference for PDF viewer
                  results.push(data);

                  // Update progress: Complete
                  updateFileProgress(i, 'complete');
                } catch (err) {
                  console.error(`Error analyzing ${file.name}:`, err);
                  updateFileProgress(i, 'error');
                }
              }

              setAnalyses({ individual_analyses: results });
            } catch (err) {
              setError(err.message || 'An error occurred during analysis');
            } finally {
              setLoading(false);
            }
          };

          const handleCitationClick = (pdfFile, citationText) => {
            setPdfViewer({ pdfFile, highlightText: citationText });
          };

          const getRecommendationColor = (rec) => {
            if (rec === 'RECOMMEND') return '#00ff88';
            if (rec === 'RECOMMEND WITH CAUTION') return '#ffaa00';
            return '#ff4444';
          };

          const getRiskColor = (risk) => {
            if (risk === 'LOW') return '#00ff88';
            if (risk === 'MEDIUM') return '#ffaa00';
            return '#ff4444';
          };

          const renderCitationText = (text, citations, pdfFile) => {
            if (!citations || citations.length === 0) {
              return <span>{text}</span>;
            }

            // Simple rendering - in production, you'd want more sophisticated text matching
            return <span>{text}</span>;
          };

          return (
            <div style={{
              minHeight: '100vh',
              background: '#0a0e1a',
              backgroundImage: `linear-gradient(rgba(0, 100, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 100, 255, 0.03) 1px, transparent 1px)`,
              backgroundSize: '40px 40px',
              color: '#e0e6ed',
              fontFamily: '"JetBrains Mono", monospace',
              padding: '0',
              margin: '0',
            }}>
              <div style={{
                borderBottom: '2px solid #1a4d8f',
                background: 'linear-gradient(180deg, #0f1624 0%, #0a0e1a 100%)',
                padding: '2rem 3rem',
                position: 'relative',
              }}>
                <h1 style={{
                  margin: 0,
                  fontSize: '2.5rem',
                  fontWeight: 700,
                  background: 'linear-gradient(135deg, #4a8fe7 0%, #00d4ff 100%)',
                  WebkitBackgroundClip: 'text',
                  WebkitTextFillColor: 'transparent',
                }}>
                  BID LEVELING AI - ENHANCED
                </h1>
                <p style={{ marginTop: '0.5rem', color: '#6b8cae', fontSize: '0.9rem' }}>
                  ⚡ Real-time progress tracking • 🔗 Click citations to view source
                </p>
              </div>

              <div style={{ maxWidth: '1400px', margin: '0 auto', padding: '3rem' }}>
                <div style={{
                  background: 'rgba(15, 22, 36, 0.6)',
                  border: '1px solid #1a4d8f',
                  borderRadius: '8px',
                  padding: '2rem',
                  marginBottom: '2rem',
                }}>
                  <div style={{
                    border: '2px dashed #1a4d8f',
                    borderRadius: '6px',
                    padding: '2rem',
                    textAlign: 'center',
                    marginBottom: '1.5rem',
                  }}>
                    <input
                      type="file"
                      multiple
                      accept=".pdf"
                      onChange={handleFileChange}
                      style={{ display: 'none' }}
                      id="file-upload"
                    />
                    <label htmlFor="file-upload" style={{ cursor: 'pointer' }}>
                      <div style={{ fontSize: '3rem', marginBottom: '1rem' }}>📄</div>
                      <div style={{ fontSize: '1.1rem', color: '#e0e6ed' }}>
                        {files.length > 0 ? `${files.length} file(s) selected` : 'Click to upload PDF files'}
                      </div>
                    </label>
                  </div>

                  {files.length > 0 && (
                    <div style={{ marginBottom: '1.5rem' }}>
                      {files.map((file, index) => (
                        <div key={index} style={{
                          display: 'flex',
                          gap: '1rem',
                          padding: '0.75rem',
                          background: 'rgba(26, 77, 143, 0.1)',
                          border: '1px solid #1a4d8f',
                          borderRadius: '4px',
                          marginBottom: '0.5rem',
                        }}>
                          <div style={{ flex: 1 }}>📎 {file.name}</div>
                          <input
                            type="text"
                            value={bidderNames[index]}
                            onChange={(e) => updateBidderName(index, e.target.value)}
                            style={{
                              padding: '0.5rem',
                              background: '#0f1624',
                              border: '1px solid #1a4d8f',
                              borderRadius: '4px',
                              color: '#e0e6ed',
                              fontFamily: 'inherit',
                              width: '200px',
                            }}
                          />
                        </div>
                      ))}
                    </div>
                  )}

                  <button
                    onClick={analyzeBids}
                    disabled={loading || files.length === 0}
                    style={{
                      width: '100%',
                      padding: '1rem',
                      background: loading ? '#1a3050' : 'linear-gradient(135deg, #1a4d8f 0%, #0064ff 100%)',
                      border: 'none',
                      borderRadius: '6px',
                      color: '#fff',
                      fontSize: '1rem',
                      cursor: loading ? 'not-allowed' : 'pointer',
                      fontFamily: 'inherit',
                    }}
                  >
                    {loading ? '⚙️ ANALYZING...' : '🔍 ANALYZE BIDS WITH CITATIONS'}
                  </button>

                  {error && (
                    <div style={{
                      marginTop: '1rem',
                      padding: '1rem',
                      background: 'rgba(255, 68, 68, 0.1)',
                      border: '1px solid #ff4444',
                      borderRadius: '4px',
                      color: '#ff8888',
                    }}>
                      ⚠️ {error}
                    </div>
                  )}
                </div>

                {/* Real-time Progress Display */}
                {loading && fileProgresses.length > 0 && (
                  <div style={{ marginBottom: '2rem' }}>
                    <h2 style={{
                      color: '#00d4ff',
                      marginBottom: '1rem',
                      fontSize: '1.5rem',
                    }}>
                      📊 Analysis Progress
                    </h2>
                    {fileProgresses.map((progress, index) => (
                      <FileProgressCard
                        key={index}
                        fileName={progress.fileName}
                        bidderName={progress.bidderName}
                        status={progress.status}
                      />
                    ))}
                  </div>
                )}

                {/* Results Display */}
                {analyses && analyses.individual_analyses && (
                  <div>
                    <h2 style={{
                      color: '#00d4ff',
                      marginBottom: '1.5rem',
                      fontSize: '1.8rem',
                      textAlign: 'center',
                    }}>
                      📋 Analysis Results
                    </h2>
                    {analyses.individual_analyses.map((analysis, index) => (
                      <div key={index} style={{
                        background: 'rgba(15, 22, 36, 0.8)',
                        border: '1px solid #1a4d8f',
                        borderRadius: '8px',
                        padding: '2rem',
                        marginBottom: '2rem',
                      }}>
                        <div style={{
                          display: 'flex',
                          justifyContent: 'space-between',
                          alignItems: 'center',
                          marginBottom: '1.5rem',
                        }}>
                          <h2 style={{ color: '#00d4ff', margin: 0 }}>
                            {analysis.bidder_name}
                          </h2>
                          <button
                            onClick={() => setPdfViewer({ pdfFile: analysis.pdfFile, highlightText: null })}
                            style={{
                              padding: '0.5rem 1rem',
                              background: '#1a4d8f',
                              border: '1px solid #4a8fe7',
                              borderRadius: '4px',
                              color: '#00d4ff',
                              cursor: 'pointer',
                              fontFamily: 'inherit',
                            }}
                          >
                            📄 View Original PDF
                          </button>
                        </div>

                        <div style={{
                          display: 'grid',
                          gridTemplateColumns: '1fr 1fr',
                          gap: '1rem',
                          marginBottom: '1.5rem',
                        }}>
                          <div style={{
                            background: 'rgba(0, 100, 255, 0.1)',
                            border: '1px solid #1a4d8f',
                            borderRadius: '6px',
                            padding: '1rem',
                            textAlign: 'center',
                          }}>
                            <div style={{ fontSize: '0.75rem', color: '#6b8cae', marginBottom: '0.5rem' }}>
                              SCORE
                            </div>
                            <div style={{ fontSize: '2.5rem', color: '#4a8fe7', fontWeight: 700 }}>
                              {analysis.overall_score}/10
                            </div>
                          </div>
                          <div style={{
                            background: 'rgba(0, 100, 255, 0.1)',
                            border: '1px solid #1a4d8f',
                            borderRadius: '6px',
                            padding: '1rem',
                            textAlign: 'center',
                          }}>
                            <div style={{ fontSize: '0.75rem', color: '#6b8cae', marginBottom: '0.5rem' }}>
                              STATUS
                            </div>
                            <div style={{
                              fontSize: '0.85rem',
                              fontWeight: 600,
                              color: getRecommendationColor(analysis.recommendation),
                            }}>
                              {analysis.recommendation}
                            </div>
                          </div>
                        </div>

                        <div style={{ marginBottom: '1.5rem' }}>
                          <div style={{ fontSize: '0.85rem', color: '#4a8fe7', marginBottom: '0.75rem' }}>
                            Summary
                          </div>
                          <p style={{ fontSize: '0.95rem', lineHeight: 1.6, color: '#e0e6ed' }}>
                            {analysis.summary}
                          </p>
                        </div>

                        <div style={{
                          display: 'grid',
                          gridTemplateColumns: '1fr 1fr',
                          gap: '1rem',
                          marginBottom: '1.5rem',
                        }}>
                          <div>
                            <div style={{ fontSize: '0.85rem', color: '#00ff88', marginBottom: '0.75rem' }}>
                              ✓ Strengths
                            </div>
                            <ul style={{ margin: 0, padding: 0, listStyle: 'none' }}>
                              {analysis.pros.map((pro, i) => (
                                <li key={i} style={{
                                  fontSize: '0.85rem',
                                  color: '#e0e6ed',
                                  marginBottom: '0.5rem',
                                  paddingLeft: '1.25rem',
                                  position: 'relative',
                                }}>
                                  <span style={{ position: 'absolute', left: 0, color: '#00ff88' }}>+</span>
                                  {typeof pro === 'object' && pro.citation ? (
                                    <span
                                      className="citation"
                                      onClick={() => handleCitationClick(analysis.pdfFile, pro.citation)}
                                      title="Click to view in PDF"
                                    >
                                      {pro.text}
                                    </span>
                                  ) : (
                                    pro
                                  )}
                                </li>
                              ))}
                            </ul>
                          </div>
                          <div>
                            <div style={{ fontSize: '0.85rem', color: '#ff8888', marginBottom: '0.75rem' }}>
                              ⚠ Concerns
                            </div>
                            <ul style={{ margin: 0, padding: 0, listStyle: 'none' }}>
                              {analysis.cons.map((con, i) => (
                                <li key={i} style={{
                                  fontSize: '0.85rem',
                                  color: '#e0e6ed',
                                  marginBottom: '0.5rem',
                                  paddingLeft: '1.25rem',
                                  position: 'relative',
                                }}>
                                  <span style={{ position: 'absolute', left: 0, color: '#ff8888' }}>-</span>
                                  {typeof con === 'object' && con.citation ? (
                                    <span
                                      className="citation"
                                      onClick={() => handleCitationClick(analysis.pdfFile, con.citation)}
                                      title="Click to view in PDF"
                                    >
                                      {con.text}
                                    </span>
                                  ) : (
                                    con
                                  )}
                                </li>
                              ))}
                            </ul>
                          </div>
                        </div>

                        <div style={{
                          background: 'rgba(0, 0, 0, 0.3)',
                          border: `1px solid ${getRiskColor(analysis.risks.level)}`,
                          borderRadius: '6px',
                          padding: '1rem',
                        }}>
                          <div style={{
                            display: 'flex',
                            justifyContent: 'space-between',
                            marginBottom: '0.75rem',
                          }}>
                            <div style={{ fontSize: '0.85rem', color: '#6b8cae' }}>
                              Risk Assessment
                            </div>
                            <div style={{
                              fontSize: '0.85rem',
                              fontWeight: 600,
                              color: getRiskColor(analysis.risks.level),
                            }}>
                              {analysis.risks.level} RISK
                            </div>
                          </div>
                          <ul style={{ margin: 0, paddingLeft: '1.5rem', fontSize: '0.85rem', color: '#e0e6ed' }}>
                            {analysis.risks.details.map((risk, i) => (
                              <li key={i}>{risk}</li>
                            ))}
                          </ul>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* PDF Viewer Modal */}
              {pdfViewer && (
                <PDFViewer
                  pdfFile={pdfViewer.pdfFile}
                  highlightText={pdfViewer.highlightText}
                  onClose={() => setPdfViewer(null)}
                />
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BidLevelingApp />);
    </script>
</body>
</html>
